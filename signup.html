<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাকাউন্ট সিস্টেম | প্রোফেশনাল</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h2 i {
            color: #667eea;
        }
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
            transition: color 0.3s;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: white;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .input-group input:focus + i, .input-group select:focus + i {
            color: #667eea;
        }
        .input-group select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        button i {
            font-size: 18px;
        }
        .logout-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 15px;
        }
        .logout-btn:hover {
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }
        .link-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .link-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }
        .link-text a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .message {
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            font-size: 14px;
        }
        .message i {
            font-size: 18px;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .profile-info {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
        }
        .profile-info p {
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 0;
            border-bottom: 1px dashed #dee2e6;
        }
        .profile-info p:last-child {
            border-bottom: none;
        }
        .profile-info i {
            width: 30px;
            color: #667eea;
            font-size: 20px;
        }
        .profile-info strong {
            font-weight: 600;
            color: #495057;
            min-width: 100px;
        }
        .edit-section {
            background: #fff3e0;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
        }
        .edit-section h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e67e22;
            margin-bottom: 15px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- সাইনআপ ফর্ম -->
        <div id="signupForm" class="form-card">
            <h2><i class="fas fa-user-plus"></i> সাইনআপ করুন</h2>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="fullName" placeholder="পূর্ণ নাম">
            </div>
            <div class="input-group">
                <i class="fas fa-pray"></i>
                <input type="text" id="religion" placeholder="ধর্ম">
            </div>
            <div class="input-group">
                <i class="fas fa-venus-mars"></i>
                <select id="sex">
                    <option value="পুরুষ">পুরুষ</option>
                    <option value="মহিলা">মহিলা</option>
                    <option value="অন্যান্য">অন্যান্য</option>
                </select>
            </div>
            <div class="input-group">
                <i class="fas fa-phone-alt"></i>
                <input type="tel" id="phoneNoSignup" placeholder="ফোন নাম্বার">
            </div>
            <div class="input-group">
                <i class="fas fa-id-card"></i>
                <input type="text" id="idNo" placeholder="আইডি নম্বর">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="passwordSignup" placeholder="পাসওয়ার্ড">
            </div>
            <button onclick="signup()"><i class="fas fa-check-circle"></i> সাইনআপ</button>
            <div class="link-text">
                ইতিমধ্যে অ্যাকাউন্ট আছে? <a onclick="showLogin()">লগইন করুন</a>
            </div>
            <div id="signupMessage" class="message hidden"></div>
        </div>

        <!-- লগইন ফর্ম -->
        <div id="loginForm" class="form-card hidden">
            <h2><i class="fas fa-sign-in-alt"></i> লগইন করুন</h2>
            <div class="input-group">
                <i class="fas fa-phone-alt"></i>
                <input type="tel" id="phoneNoLogin" placeholder="ফোন নাম্বার">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="passwordLogin" placeholder="পাসওয়ার্ড">
            </div>
            <button onclick="login()"><i class="fas fa-arrow-right"></i> লগইন</button>
            <div class="link-text">
                নতুন ব্যবহারকারী? <a onclick="showSignup()">সাইনআপ করুন</a>
            </div>
            <div id="loginMessage" class="message hidden"></div>
        </div>

        <!-- প্রোফাইল ভিউ -->
        <div id="profileView" class="form-card hidden">
            <h2><i class="fas fa-user-circle"></i> প্রোফাইল</h2>
            <div class="profile-info" id="profileDetails"></div>
            <div class="edit-section">
                <h3><i class="fas fa-edit"></i> নাম পরিবর্তন করুন</h3>
                <div class="input-group">
                    <i class="fas fa-user-edit"></i>
                    <input type="text" id="newName" placeholder="নতুন নাম">
                </div>
                <button onclick="updateName()"><i class="fas fa-save"></i> আপডেট</button>
            </div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> লগআউট</button>
            <div id="profileMessage" class="message hidden"></div>
        </div>
    </div>

    <script>
        // আপনার ওয়েব অ্যাপ URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbxnPpqEVGg04Gc6NVQRO0zVhvTCk4gxAGrSq5TNB_YrFBuPidat9uV-NajYjZ8AZdJAtg/exec';

        // ইউটিলিটি ফাংশন
        function showMessage(elementId, type, text) {
            const msgDiv = document.getElementById(elementId);
            msgDiv.className = `message ${type}`;
            msgDiv.innerHTML = type === 'success' 
                ? `<i class="fas fa-check-circle"></i> ${text}`
                : `<i class="fas fa-exclamation-circle"></i> ${text}`;
            msgDiv.classList.remove('hidden');
            setTimeout(() => msgDiv.classList.add('hidden'), 5000);
        }

        function showSignup() {
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('profileView').classList.add('hidden');
        }
        function showLogin() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('profileView').classList.add('hidden');
        }
        function showProfile() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('profileView').classList.remove('hidden');
        }

        async function signup() {
            const data = {
                action: 'signup',
                fullName: document.getElementById('fullName').value.trim(),
                religion: document.getElementById('religion').value.trim(),
                sex: document.getElementById('sex').value,
                phoneNo: document.getElementById('phoneNoSignup').value.trim(),
                idNo: document.getElementById('idNo').value.trim(),
                password: document.getElementById('passwordSignup').value
            };
            for (let key in data) if (key!='action' && !data[key]) 
                return showMessage('signupMessage', 'error', 'সব ফিল্ড পূরণ করুন');

            try {
                const res = await fetch(API_URL, { method:'POST', body:JSON.stringify(data) });
                const result = await res.json();
                if (result.status === 'success') {
                    showMessage('signupMessage', 'success', result.message);
                    document.getElementById('fullName').value = '';
                    document.getElementById('religion').value = '';
                    document.getElementById('phoneNoSignup').value = '';
                    document.getElementById('idNo').value = '';
                    document.getElementById('passwordSignup').value = '';
                } else {
                    showMessage('signupMessage', 'error', result.message);
                }
            } catch (e) {
                showMessage('signupMessage', 'error', 'নেটওয়ার্ক সমস্যা: ' + e.message);
            }
        }

        async function login() {
            const phone = document.getElementById('phoneNoLogin').value.trim();
            const pass = document.getElementById('passwordLogin').value;
            if (!phone || !pass) 
                return showMessage('loginMessage', 'error', 'ফোন ও পাসওয়ার্ড দিন');

            try {
                const res = await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'login', phoneNo:phone, password:pass }) });
                const result = await res.json();
                if (result.status === 'success') {
                    localStorage.setItem('loggedInUser', result.user.phoneNo);
                    displayProfile(result.user);
                    showProfile();
                } else {
                    showMessage('loginMessage', 'error', result.message);
                }
            } catch (e) {
                showMessage('loginMessage', 'error', 'নেটওয়ার্ক সমস্যা: ' + e.message);
            }
        }

        function displayProfile(user) {
            document.getElementById('profileDetails').innerHTML = `
                <p><i class="fas fa-user"></i> <strong>পূর্ণ নাম:</strong> ${user.fullName}</p>
                <p><i class="fas fa-pray"></i> <strong>ধর্ম:</strong> ${user.religion}</p>
                <p><i class="fas fa-venus-mars"></i> <strong>লিঙ্গ:</strong> ${user.sex}</p>
                <p><i class="fas fa-phone-alt"></i> <strong>ফোন নাম্বার:</strong> ${user.phoneNo}</p>
                <p><i class="fas fa-id-card"></i> <strong>আইডি নম্বর:</strong> ${user.idNo}</p>
            `;
            document.getElementById('newName').value = user.fullName;
        }

        async function updateName() {
            const phone = localStorage.getItem('loggedInUser');
            if (!phone) return logout();
            const newName = document.getElementById('newName').value.trim();
            if (!newName) 
                return showMessage('profileMessage', 'error', 'নাম লিখুন');

            try {
                const res = await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'updateName', phoneNo:phone, newFullName:newName }) });
                const result = await res.json();
                if (result.status === 'success') {
                    showMessage('profileMessage', 'success', result.message);
                    loadProfile(); // রিফ্রেশ
                } else {
                    showMessage('profileMessage', 'error', result.message);
                }
            } catch (e) {
                showMessage('profileMessage', 'error', 'নেটওয়ার্ক সমস্যা: ' + e.message);
            }
        }

        async function loadProfile() {
            const phone = localStorage.getItem('loggedInUser');
            if (!phone) return logout();
            try {
                const res = await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'getProfile', phoneNo:phone }) });
                const result = await res.json();
                if (result.status === 'success') displayProfile(result.user);
                else logout();
            } catch (e) {
                console.error(e);
                logout();
            }
        }

        function logout() {
            localStorage.removeItem('loggedInUser');
            showLogin();
        }

        window.onload = async () => {
            const loggedIn = localStorage.getItem('loggedInUser');
            if (loggedIn) {
                await loadProfile();
                showProfile();
            } else {
                showLogin();
            }
        };
    </script>
</body>
</html>
